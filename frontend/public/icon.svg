<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Container (Rounded Square for App Icon standard) -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  
  <!-- Inner Detail / Grid lines -->
  <path d="M50 256 H462" stroke="#1e293b" stroke-width="2" />
  <path d="M256 50 V462" stroke="#1e293b" stroke-width="2" />
  <circle cx="256" cy="256" r="180" stroke="#1e293b" stroke-width="2" fill="none" />

  <!-- Main Logo: Stylized Pulse/W -->
  <path 
    d="M110 160 L180 360 L256 200 L332 360 L402 160" 
    stroke="url(#grad1)" 
    stroke-width="45" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
